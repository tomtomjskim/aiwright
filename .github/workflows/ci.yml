name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aiwright-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm run validate:rfc-schemas
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run test:dist
      - run: npm audit --omit=dev --audit-level=high
